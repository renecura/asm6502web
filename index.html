<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#5268d9">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">

    <link rel="stylesheet" href="./src/css/6502-assembler.css">

    <title>6502 Assembler</title>
</head>
<body>
    <h1>6502 Assembler</h1>

    <div id="editor" style="height: 300px;"></div> 

    <button id="assemble" type="button">Ensamblar</button>

    <ul id="errors"></ul>
    <div id="output"></div>

    <!-- Plantilla de la tabla: el thead define las columnas y la fila data-row se repite por instrucción -->
    <template id="assembly-table-template">
        <table class="assembly-table">
            <thead>
                <tr>
                    <th data-col="lineno">#</th>
                    <th data-col="label"></th>
                    <th data-col="nme">codigo</th>
                    <th data-col="rawargs"></th>
                    <th data-col="mode">modo</th>
                    <th data-col="address">dir</th>
                    <th data-col="asm">memoria</th>
                </tr>
            </thead>
            <tbody>
                <tr data-row>
                    <td data-field="lineno"></td>
                    <td data-field="label"></td>
                    <td data-field="nme"></td>
                    <td data-field="rawargs"></td>
                    <td data-field="mode"></td>
                    <td data-field="address"></td>
                    <td data-field="asm"></td>
                </tr>
            </tbody>
        </table>
    </template>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
