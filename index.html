<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>6502 Assembler</title>

    <link rel="stylesheet" href="./css/6502-assembler.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prism-code-editor@5/dist/layout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prism-code-editor@5/dist/scrollbar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prism-code-editor@5/dist/themes/github-dark.css">
    
</head>
<body>
    <h1>6502 Assembler</h1>

    <div id="editor" style="height: 300px;"></div> 

<!--     <textarea id="code" spellcheck="false">LDA #$02
STA $02
LDA #$34    ; Valor inmediato
STA $0190
LDA #300    ; Valor fuera de rango para el modo INM: 300
LDA #$B6
LDA %10100101 ; Probando el binario
LDY #$00
hola mundo  ; Instrucción inválida: hola mundo
STA ($01),Y
loop:   ; Defino una etiqueta
INY
STA ($01),Y
BBB #$45  ;Instrucción desconocida: BBB
LDA 15
BCC loop
INY $45 ; Modo ZP no válido para INY</textarea> -->

    <button id="assemble" type="button">Ensamblar</button>

    <ul id="errors"></ul>
    <div id="output"></div>

    <!-- Plantilla de la tabla: el thead define las columnas y la fila data-row se repite por instrucción -->
    <template id="assembly-table-template">
        <table class="assembly-table">
            <thead>
                <tr>
                    <th>linea</th>
                    <th>codigo</th>
                    <th>mne</th>
                    <th>modo</th>
                    <th>opcode</th>
                    <th>oper</th>
                    <th>etiqueta</th>
                    <th>dir</th>
                    <th>máquina</th>
                </tr>
            </thead>
            <tbody>
                <tr data-row>
                    <td data-field="lineno"></td>
                    <td data-field="src"></td>
                    <td data-field="nme"></td>
                    <td data-field="mode"></td>
                    <td data-field="opcode"></td>
                    <td data-field="args"></td>
                    <td data-field="label"></td>
                    <td data-field="address"></td>
                    <td data-field="asm"></td>
                </tr>
            </tbody>
        </table>
    </template>

    <script type="module">
        import { createEditor } from 'https://cdn.jsdelivr.net/npm/prism-code-editor@5/dist/index.js';
        import 'https://cdn.jsdelivr.net/npm/prism-code-editor@5/dist/prism/languages/asm6502.js';

        import { assemble } from "./src/assembler.js";
        import { renderAssemblyTable } from "./src/assembly-table.js";

        const editor = createEditor('#editor', {
            language: 'asm6502',
            theme: 'github-dark',
            class: 'code',
            value: 'LDA #$02 \n\
STA $02 \n\
LDA #$34    ; Valor inmediato  \n\
LDA #$34    ; Valor inmediato  \n\
STA $0190 \n\
LDA #300    ; Valor fuera de rango para el modo INM: 300 \n\
LDA #$B6 \n\
LDA %10100101 ; Probando el binario \n\
LDY #$00 \n\
hola mundo  ; Instrucción inválida: hola mundo \n\
STA ($01),Y \n\
loop:   ; Defino una etiqueta \n\
INY \n\
STA ($01),Y \n\
BBB #$45  ;Instrucción desconocida: BBB \n\
LDA 15 \n\
BCC loop \n\
INY $45 ; Modo ZP no válido para INY', 
        });

        const output = document.getElementById("output");
        const errorslist = document.getElementById("errors");

        document.getElementById("assemble").addEventListener("click", () => {
            const {result, errors} = assemble(editor.value);

            output.replaceChildren(renderAssemblyTable(result));

            // Las líneas con error no salen en la tabla: se listan aparte
            errorslist.replaceChildren(
                ...errors
                    .map(({ lineno, src, err }) => {

                        editor.lines[lineno].classList.add('highlighted');

                        const li = document.createElement("li");
                        li.textContent = `Línea ${lineno}: ${err} (${src})`;
                        return li;
                    })
            );
        });
    </script>
</body>
</html>
